name: acu-router-alpha

services:
  postgres-newapi:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: newapi_alpha
      POSTGRES_USER: newapi_alpha
      POSTGRES_PASSWORD: ${POSTGRES_NEWAPI_PASSWORD:?set POSTGRES_NEWAPI_PASSWORD}
    volumes:
      - postgres-newapi-data:/var/lib/postgresql/data
    networks: [alpha-backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newapi_alpha -d newapi_alpha"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres-acu:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: acu_alpha
      POSTGRES_USER: acu_alpha
      POSTGRES_PASSWORD: ${POSTGRES_ACU_PASSWORD:?set POSTGRES_ACU_PASSWORD}
    volumes:
      - postgres-acu-data:/var/lib/postgresql/data
    networks: [alpha-backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acu_alpha -d acu_alpha"]
      interval: 5s
      timeout: 3s
      retries: 20

  acu-migrate:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      postgres-acu:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_ACU_PASSWORD:?set POSTGRES_ACU_PASSWORD}
    volumes:
      - ../../migrations/acu/0001_alpha_p0.sql:/migration/0001_alpha_p0.sql:ro
      - ../../migrations/acu/0002_provider_channel_health.sql:/migration/0002_provider_channel_health.sql:ro
      - ../../migrations/acu/0003_web_intent_source.sql:/migration/0003_web_intent_source.sql:ro
      - ../../migrations/acu/0004_rc2_context_ledger.sql:/migration/0004_rc2_context_ledger.sql:ro
      - ../../migrations/acu/0005_rc2_judge_reconciliation.sql:/migration/0005_rc2_judge_reconciliation.sql:ro
      - ../../migrations/acu/0006_rc21_cost_semantics.sql:/migration/0006_rc21_cost_semantics.sql:ro
      - ../../migrations/acu/0007_rc22_judge_cutover.sql:/migration/0007_rc22_judge_cutover.sql:ro
      - ../../migrations/acu/0008_alpha_final_user_loop.sql:/migration/0008_alpha_final_user_loop.sql:ro
      - ../../migrations/acu/0009_raw_judge_context.sql:/migration/0009_raw_judge_context.sql:ro
      - ../../migrations/acu/0010_supply_observability.sql:/migration/0010_supply_observability.sql:ro
      - ../../migrations/acu/0011_verified_model_pool_probe.sql:/migration/0011_verified_model_pool_probe.sql:ro
      - ../../migrations/acu/0012_profile_policy_probe_worker.sql:/migration/0012_profile_policy_probe_worker.sql:ro
      - ../../migrations/acu/0013_full_pool_probe_runs.sql:/migration/0013_full_pool_probe_runs.sql:ro
      - ../../migrations/acu/0014_judge_same_model_failover.sql:/migration/0014_judge_same_model_failover.sql:ro
      - ../../migrations/acu/0015_judge_profile_attempt_limit.sql:/migration/0015_judge_profile_attempt_limit.sql:ro
      - ../../migrations/acu/0016_judge_profile_attempt_limit_5.sql:/migration/0016_judge_profile_attempt_limit_5.sql:ro
    networks: [alpha-backend]
    command:
      - /bin/sh
      - -ec
      - |
        if [ "$$(psql -h postgres-acu -U acu_alpha -d acu_alpha -tAc "SELECT to_regclass('public.acu_sessions')")" != "acu_sessions" ]; then
          psql -v ON_ERROR_STOP=1 -h postgres-acu -U acu_alpha -d acu_alpha -f /migration/0001_alpha_p0.sql
        fi
        apply_migration() {
          version="$$1"
          file="$$2"
          migration_table="$$(psql -h postgres-acu -U acu_alpha -d acu_alpha -tAc \
            "SELECT to_regclass('public.acu_schema_migrations')")"
          if [ "$$migration_table" != "acu_schema_migrations" ]; then
            psql -v ON_ERROR_STOP=1 -h postgres-acu -U acu_alpha -d acu_alpha -f "$$file"
            return
          fi
          applied="$$(psql -h postgres-acu -U acu_alpha -d acu_alpha -tAc \
            "SELECT EXISTS (SELECT 1 FROM acu_schema_migrations WHERE migration_version='$${version}')")"
          if [ "$$applied" != "t" ]; then
            psql -v ON_ERROR_STOP=1 -h postgres-acu -U acu_alpha -d acu_alpha -f "$$file"
          fi
        }
        apply_migration 0002_provider_channel_health /migration/0002_provider_channel_health.sql
        apply_migration 0003_web_intent_source /migration/0003_web_intent_source.sql
        apply_migration 0004_rc2_context_ledger /migration/0004_rc2_context_ledger.sql
        apply_migration 0005_rc2_judge_reconciliation /migration/0005_rc2_judge_reconciliation.sql
        apply_migration 0006_rc21_cost_semantics /migration/0006_rc21_cost_semantics.sql
        apply_migration 0007_rc22_judge_cutover /migration/0007_rc22_judge_cutover.sql
        apply_migration 0008_alpha_final_user_loop /migration/0008_alpha_final_user_loop.sql
        apply_migration 0009_raw_judge_context /migration/0009_raw_judge_context.sql
        apply_migration 0010_supply_observability /migration/0010_supply_observability.sql
        apply_migration 0011_verified_model_pool_probe /migration/0011_verified_model_pool_probe.sql
        apply_migration 0012_profile_policy_probe_worker /migration/0012_profile_policy_probe_worker.sql
        apply_migration 0013_full_pool_probe_runs /migration/0013_full_pool_probe_runs.sql
        apply_migration 0014_judge_same_model_failover /migration/0014_judge_same_model_failover.sql
        apply_migration 0015_judge_profile_attempt_limit /migration/0015_judge_profile_attempt_limit.sql
        apply_migration 0016_judge_profile_attempt_limit_5 /migration/0016_judge_profile_attempt_limit_5.sql

  newapi-codex-pool-sync:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      new-api:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_NEWAPI_PASSWORD:?set POSTGRES_NEWAPI_PASSWORD}
    volumes:
      - ./sync-newapi-codex-pool.sql:/sync/sync-newapi-codex-pool.sql:ro
      - ./reconcile-newapi-rc2-ledger.sql:/sync/reconcile-newapi-rc2-ledger.sql:ro
    networks: [alpha-backend]
    command:
      - /bin/sh
      - -ec
      - |
        psql -v ON_ERROR_STOP=1 -h postgres-newapi -U newapi_alpha -d newapi_alpha -f /sync/sync-newapi-codex-pool.sql
        psql -v ON_ERROR_STOP=1 -h postgres-newapi -U newapi_alpha -d newapi_alpha -f /sync/reconcile-newapi-rc2-ledger.sql

  acu-router:
    build:
      context: ../..
      dockerfile: deploy/alpha/Dockerfile.acu
      args:
        BUILD_COMMIT_SHA: ${CLAWROUTER_BUILD_COMMIT_SHA:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
        BUILD_BRANCH: ${CLAWROUTER_BUILD_BRANCH:-unknown}
        SCHEMA_VERSION: 0016_judge_profile_attempt_limit_5
    restart: unless-stopped
    depends_on:
      acu-migrate:
        condition: service_completed_successfully
      new-api:
        condition: service_healthy
    environment:
      ACU_BIND_ADDRESS: 0.0.0.0
      ACU_PORT: 8403
      ACU_MAX_REQUEST_BODY_MB: ${ACU_MAX_REQUEST_BODY_MB:-128}
      ACU_DATABASE_URL: postgresql://acu_alpha:${POSTGRES_ACU_PASSWORD}@postgres-acu:5432/acu_alpha
      ACU_TRUSTED_IDENTITY_SECRET: ${ACU_TRUSTED_IDENTITY_SECRET:?set ACU_TRUSTED_IDENTITY_SECRET}
      ACU_ADMIN_TRACE_TOKEN: ${ACU_ADMIN_TRACE_TOKEN:?set ACU_ADMIN_TRACE_TOKEN}
      NEW_API_INTERNAL_BASE_URL: http://new-api:3000
      ACU_EXECUTION_PROFILES_FILE: /app/config/execution-profiles.json
      ACU_PROVIDER_DISCOVERY_FILE: /app/config/provider-channel-model-discovery.json
      ACU_PROVIDER_PREFLIGHT_FILE: /app/config/provider-channel-preflight-observations.json
      ACU_PROVIDER_ECONOMICS_FILE: /app/config/provider-economics.json
      ACU_DEMO_ROUTER_ENABLED: "true"
      ACU_WORK_PHASE_ROUTING_ENABLED: ${ACU_WORK_PHASE_ROUTING_ENABLED:-true}
      ACU_LUNA_MAX_PRESET_ENABLED: ${ACU_LUNA_MAX_PRESET_ENABLED:-true}
      ACU_SOL_HIGH_PRESET_ENABLED: ${ACU_SOL_HIGH_PRESET_ENABLED:-true}
      ACU_SOL_XHIGH_PRESET_ENABLED: ${ACU_SOL_XHIGH_PRESET_ENABLED:-true}
      ACU_TERRA_MAX_PRESET_ENABLED: ${ACU_TERRA_MAX_PRESET_ENABLED:-true}
      ACU_PROBE_DAILY_BUDGET_CNY: ${ACU_PROBE_DAILY_BUDGET_CNY:-1.00}
      ACU_RETAIL_MARKUP_MULTIPLIER: ${ACU_RETAIL_MARKUP_MULTIPLIER:-1.25}
      ACU_BILLING_POLICY_VERSION: ${ACU_BILLING_POLICY_VERSION:-acu-retail-v1}
      ACU_JUDGE_API_KEY: ${ACU_CHANNEL_LUCEN_CX014_PRO_STABLE_API_KEY:?set ACU_CHANNEL_LUCEN_CX014_PRO_STABLE_API_KEY}
      ACU_JUDGE_MODEL: gpt-5.6-sol
      ACU_JUDGE_REASONING_EFFORT: ${ACU_JUDGE_REASONING_EFFORT:-default}
      ACU_JUDGE_PROVIDER: lucen
      ACU_JUDGE_BASE_URL: ${ACU_CHANNEL_LUCEN_CX014_PRO_STABLE_BASE_URL:-https://lucen.cc}/v1
      ACU_JUDGE_BACKUP_API_KEY: ${MIMO_API_KEY:?set MIMO_API_KEY}
      ACU_JUDGE_BACKUP_MODEL: mimo-v2.5-pro
      ACU_JUDGE_BACKUP_PROVIDER: xiaomi_mimo
      ACU_JUDGE_BACKUP_BASE_URL: https://token-plan-cn.xiaomimimo.com/v1
      ACU_JUDGE_ROLLBACK_TO_BACKUP: ${ACU_JUDGE_ROLLBACK_TO_BACKUP:-false}
      ACU_JUDGE_ECONOMICS_PROVIDER_ID: lucen
      ACU_JUDGE_FIRST_BYTE_TIMEOUT_MS: ${ACU_JUDGE_FIRST_BYTE_TIMEOUT_MS:-0}
      ACU_JUDGE_TOTAL_TIMEOUT_MS: ${ACU_JUDGE_TOTAL_TIMEOUT_MS:-270000}
      ACU_JUDGE_SYNC_BACKUP_ENABLED: ${ACU_JUDGE_SYNC_BACKUP_ENABLED:-false}
      ACU_JUDGE_CONTEXT_POLICY: ${ACU_JUDGE_CONTEXT_POLICY:-full_native}
      ACU_JUDGE_SAME_MODEL_FAILOVER_ENABLED: ${ACU_JUDGE_SAME_MODEL_FAILOVER_ENABLED:-true}
      ACU_JUDGE_MAX_PROFILE_ATTEMPTS: ${ACU_JUDGE_MAX_PROFILE_ATTEMPTS:-5}
      ACU_JUDGE_PRIMARY_PROFILE_ID: ${ACU_JUDGE_PRIMARY_PROFILE_ID:-lucen-cx014-pro-stable:gpt-5.6-sol:responses}
      ACU_JUDGE_MAX_CONTEXT_TOKENS: ${ACU_JUDGE_MAX_CONTEXT_TOKENS:-1000000}
      ACU_JUDGE_BACKUP_MAX_CONTEXT_TOKENS: ${ACU_JUDGE_BACKUP_MAX_CONTEXT_TOKENS:-1000000}
      ACU_JUDGE_CACHE_PATH: /var/lib/acu/judge-cache-v3.json
      CLOSEAI_OPENAI_BASE_URL: ${CLOSEAI_OPENAI_BASE_URL:-https://api.openai-proxy.org/v1}
      CLOSEAI_ANTHROPIC_BASE_URL: ${CLOSEAI_ANTHROPIC_BASE_URL:-https://api.openai-proxy.org/anthropic}
      CLOSEAI_API_KEY: ${CLOSEAI_API_KEY:?set CLOSEAI_API_KEY}
    env_file:
      - ../../.env
    volumes:
      - ./execution-profiles.json:/app/config/execution-profiles.json:ro
      - ./provider-channel-model-discovery.json:/app/config/provider-channel-model-discovery.json:ro
      - ./provider-channel-preflight-observations.json:/app/config/provider-channel-preflight-observations.json:ro
      - ./provider-economics.json:/app/config/provider-economics.json:ro
      - ./provider-channels.json:/app/config/provider-channels.json:ro
      - ./provider-model-profiles.json:/app/config/provider-model-profiles.json:ro
      - acu-runtime-data:/var/lib/acu
    expose: ["8403"]
    networks: [alpha-backend]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8403/internal/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20

  new-api:
    build:
      context: ${NEW_API_SOURCE_DIR:-../../../new-api}
      dockerfile: Dockerfile
      args:
        BUILD_COMMIT_SHA: ${NEW_API_BUILD_COMMIT_SHA:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
        BUILD_BRANCH: ${NEW_API_BUILD_BRANCH:-unknown}
        SCHEMA_VERSION: acu_usage_finalize_rc22
    restart: unless-stopped
    command: ["--log-dir", "/app/logs"]
    depends_on:
      postgres-newapi:
        condition: service_healthy
    environment:
      SQL_DSN: postgresql://newapi_alpha:${POSTGRES_NEWAPI_PASSWORD}@postgres-newapi:5432/newapi_alpha
      SESSION_SECRET: ${NEW_API_SESSION_SECRET:?set NEW_API_SESSION_SECRET}
      ACU_TRUSTED_IDENTITY_SECRET: ${ACU_TRUSTED_IDENTITY_SECRET:?set ACU_TRUSTED_IDENTITY_SECRET}
      ACU_ROUTER_INTERNAL_URL: http://acu-router:8403
      ACU_ADMIN_TRACE_TOKEN: ${ACU_ADMIN_TRACE_TOKEN:?set ACU_ADMIN_TRACE_TOKEN}
      BATCH_UPDATE_ENABLED: "false"
      MEMORY_CACHE_ENABLED: "false"
      ERROR_LOG_ENABLED: "true"
      GIN_MODE: release
      TZ: UTC
      ACU_PRICING_CATALOG_FILE: /app/acu-catalog/newapi-acu-catalog.json
      ACU_PRICING_DISPLAY_MODE: ${ACU_PRICING_DISPLAY_MODE:-comparison}
      ACU_PRICING_REFERENCE_USD_CNY: ${ACU_PRICING_REFERENCE_USD_CNY:-7.2}
      ACU_SCHEMA_VERSION: 0008_alpha_final_user_loop
      ACU_JUDGE_PRIMARY_MODEL: gpt-5.6-sol
      ACU_JUDGE_BACKUP_MODEL: mimo-v2.5-pro
      ACU_ROUTING_FORMULA_VERSION: acu-routing-model-v0.5
    volumes:
      - newapi-logs:/app/logs
      - ./newapi-acu-catalog.json:/app/acu-catalog/newapi-acu-catalog.json:ro
    ports:
      - "${NEW_API_BIND_ADDRESS:-127.0.0.1}:${NEW_API_PORT:-3200}:3000"
    networks: [alpha-backend]
    healthcheck:
      test: ["CMD-SHELL", 'wget -q -O - http://127.0.0.1:3000/api/status | grep -q ''"success":true''']
      interval: 5s
      timeout: 3s
      retries: 30

networks:
  alpha-backend:
    driver: bridge

volumes:
  postgres-newapi-data:
  postgres-acu-data:
  newapi-logs:
  acu-runtime-data:
