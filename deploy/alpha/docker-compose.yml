name: acu-router-alpha

services:
  postgres-newapi:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: newapi_alpha
      POSTGRES_USER: newapi_alpha
      POSTGRES_PASSWORD: ${POSTGRES_NEWAPI_PASSWORD:?set POSTGRES_NEWAPI_PASSWORD}
    volumes:
      - postgres-newapi-data:/var/lib/postgresql/data
    networks: [alpha-backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newapi_alpha -d newapi_alpha"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres-acu:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: acu_alpha
      POSTGRES_USER: acu_alpha
      POSTGRES_PASSWORD: ${POSTGRES_ACU_PASSWORD:?set POSTGRES_ACU_PASSWORD}
    volumes:
      - postgres-acu-data:/var/lib/postgresql/data
    networks: [alpha-backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acu_alpha -d acu_alpha"]
      interval: 5s
      timeout: 3s
      retries: 20

  acu-migrate:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      postgres-acu:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_ACU_PASSWORD:?set POSTGRES_ACU_PASSWORD}
    volumes:
      - ../../migrations/acu/0001_alpha_p0.sql:/migration/0001_alpha_p0.sql:ro
      - ../../migrations/acu/0002_provider_channel_health.sql:/migration/0002_provider_channel_health.sql:ro
      - ../../migrations/acu/0003_web_intent_source.sql:/migration/0003_web_intent_source.sql:ro
      - ../../migrations/acu/0004_rc2_context_ledger.sql:/migration/0004_rc2_context_ledger.sql:ro
      - ../../migrations/acu/0005_rc2_judge_reconciliation.sql:/migration/0005_rc2_judge_reconciliation.sql:ro
    networks: [alpha-backend]
    command:
      - /bin/sh
      - -ec
      - |
        if [ "$$(psql -h postgres-acu -U acu_alpha -d acu_alpha -tAc "SELECT to_regclass('public.acu_sessions')")" != "acu_sessions" ]; then
          psql -v ON_ERROR_STOP=1 -h postgres-acu -U acu_alpha -d acu_alpha -f /migration/0001_alpha_p0.sql
        fi
        psql -v ON_ERROR_STOP=1 -h postgres-acu -U acu_alpha -d acu_alpha -f /migration/0002_provider_channel_health.sql
        psql -v ON_ERROR_STOP=1 -h postgres-acu -U acu_alpha -d acu_alpha -f /migration/0003_web_intent_source.sql
        psql -v ON_ERROR_STOP=1 -h postgres-acu -U acu_alpha -d acu_alpha -f /migration/0004_rc2_context_ledger.sql
        psql -v ON_ERROR_STOP=1 -h postgres-acu -U acu_alpha -d acu_alpha -f /migration/0005_rc2_judge_reconciliation.sql

  newapi-codex-pool-sync:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      new-api:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_NEWAPI_PASSWORD:?set POSTGRES_NEWAPI_PASSWORD}
    volumes:
      - ./sync-newapi-codex-pool.sql:/sync/sync-newapi-codex-pool.sql:ro
      - ./reconcile-newapi-rc2-ledger.sql:/sync/reconcile-newapi-rc2-ledger.sql:ro
    networks: [alpha-backend]
    command:
      - /bin/sh
      - -ec
      - |
        psql -v ON_ERROR_STOP=1 -h postgres-newapi -U newapi_alpha -d newapi_alpha -f /sync/sync-newapi-codex-pool.sql
        psql -v ON_ERROR_STOP=1 -h postgres-newapi -U newapi_alpha -d newapi_alpha -f /sync/reconcile-newapi-rc2-ledger.sql

  acu-router:
    build:
      context: ../..
      dockerfile: deploy/alpha/Dockerfile.acu
    restart: unless-stopped
    depends_on:
      acu-migrate:
        condition: service_completed_successfully
      new-api:
        condition: service_healthy
    environment:
      ACU_BIND_ADDRESS: 0.0.0.0
      ACU_PORT: 8403
      ACU_DATABASE_URL: postgresql://acu_alpha:${POSTGRES_ACU_PASSWORD}@postgres-acu:5432/acu_alpha
      ACU_TRUSTED_IDENTITY_SECRET: ${ACU_TRUSTED_IDENTITY_SECRET:?set ACU_TRUSTED_IDENTITY_SECRET}
      ACU_ADMIN_TRACE_TOKEN: ${ACU_ADMIN_TRACE_TOKEN:?set ACU_ADMIN_TRACE_TOKEN}
      NEW_API_INTERNAL_BASE_URL: http://new-api:3000
      ACU_EXECUTION_PROFILES_FILE: /app/config/execution-profiles.json
      ACU_PROVIDER_ECONOMICS_FILE: /app/config/provider-economics.json
      ACU_DEMO_ROUTER_ENABLED: "true"
      ACU_JUDGE_API_KEY: ${ACU_JUDGE_API_KEY:?set ACU_JUDGE_API_KEY}
      ACU_JUDGE_MODEL: ${ACU_JUDGE_MODEL:-deepseek-v4-flash}
      ACU_JUDGE_BASE_URL: ${ACU_JUDGE_BASE_URL:-https://api.openai-proxy.org/v1}
      ACU_JUDGE_ECONOMICS_PROVIDER_ID: closeai
      ACU_JUDGE_TIMEOUT_MS: ${ACU_JUDGE_TIMEOUT_MS:-20000}
      ACU_JUDGE_MAX_CONTEXT_TOKENS: ${ACU_JUDGE_MAX_CONTEXT_TOKENS:-6000}
      ACU_JUDGE_CACHE_PATH: /var/lib/acu/judge-cache-v3.json
      CLOSEAI_OPENAI_BASE_URL: ${CLOSEAI_OPENAI_BASE_URL:-https://api.openai-proxy.org/v1}
      CLOSEAI_ANTHROPIC_BASE_URL: ${CLOSEAI_ANTHROPIC_BASE_URL:-https://api.openai-proxy.org/anthropic}
      CLOSEAI_API_KEY: ${CLOSEAI_API_KEY:?set CLOSEAI_API_KEY}
    env_file:
      - ../../.env
    volumes:
      - ./execution-profiles.json:/app/config/execution-profiles.json:ro
      - ./provider-economics.json:/app/config/provider-economics.json:ro
      - ./provider-channels.json:/app/config/provider-channels.json:ro
      - ./provider-model-profiles.json:/app/config/provider-model-profiles.json:ro
      - acu-runtime-data:/var/lib/acu
    expose: ["8403"]
    networks: [alpha-backend]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8403/internal/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20

  new-api:
    build:
      context: ${NEW_API_SOURCE_DIR:-../../../new-api}
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["--log-dir", "/app/logs"]
    depends_on:
      postgres-newapi:
        condition: service_healthy
    environment:
      SQL_DSN: postgresql://newapi_alpha:${POSTGRES_NEWAPI_PASSWORD}@postgres-newapi:5432/newapi_alpha
      SESSION_SECRET: ${NEW_API_SESSION_SECRET:?set NEW_API_SESSION_SECRET}
      ACU_TRUSTED_IDENTITY_SECRET: ${ACU_TRUSTED_IDENTITY_SECRET:?set ACU_TRUSTED_IDENTITY_SECRET}
      BATCH_UPDATE_ENABLED: "false"
      MEMORY_CACHE_ENABLED: "false"
      ERROR_LOG_ENABLED: "true"
      GIN_MODE: release
      TZ: UTC
      ACU_PRICING_CATALOG_FILE: /app/acu-catalog/newapi-acu-catalog.json
    volumes:
      - newapi-logs:/app/logs
      - ./newapi-acu-catalog.json:/app/acu-catalog/newapi-acu-catalog.json:ro
    ports:
      - "${NEW_API_BIND_ADDRESS:-127.0.0.1}:${NEW_API_PORT:-3200}:3000"
    networks: [alpha-backend]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/status | grep -q '\"success\":true'"]
      interval: 5s
      timeout: 3s
      retries: 30

networks:
  alpha-backend:
    driver: bridge

volumes:
  postgres-newapi-data:
  postgres-acu-data:
  newapi-logs:
  acu-runtime-data:
